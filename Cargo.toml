[package]
name = "pipatab"
version = "0.1.0"
edition = "2021"
description = "Pipatab turns your iPad into a wireless graphics tablet (pen only, no screen mirroring)."

[dependencies]
bitflags = { version = "2.6", features = ["serde"] }
bytes = "1.7"
clap = { version = "4.5", features = ["derive"] }
fastwebsockets = { version = "0.8", features = ["upgrade", "unstable-split"] }
http-body-util = "0.1"
hyper = { version = "1.4", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "signal", "sync", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["ansi"], default-features = false }
url = "2.5"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = [
    "winuser", "windef", "winerror",
    "minwindef", "errhandlingapi",
] }

[profile.release]
lto = true
opt-level = 3
