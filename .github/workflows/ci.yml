name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install client tooling
        run: npm ci

      - name: Typecheck client
        run: npx tsc --noEmit

      - name: Bundle client
        run: npm run build

      - name: Vet server
        env:
          GOOS: windows
          GOARCH: amd64
        run: go vet ./...

      - name: Build server
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w" -o Pipatab.exe .
