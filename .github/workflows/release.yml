name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install client tooling
        run: npm ci

      - name: Typecheck client
        run: npx tsc --noEmit

      - name: Bundle client
        run: npm run build

      - name: Build server
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: >
          go build -trimpath
          -ldflags "-s -w -X main.version=${{ github.ref_name }}"
          -o pipatab.exe .

      - name: Package
        run: zip "pipatab-${{ github.ref_name }}-windows-amd64.zip" pipatab.exe README.md CHANGELOG.md LICENSE

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: pipatab-*.zip
          generate_release_notes: true
