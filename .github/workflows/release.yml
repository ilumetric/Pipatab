name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install client tooling
        run: npm ci

      - name: Typecheck client
        run: npx tsc --noEmit

      - name: Bundle client
        run: npm run build

      - name: Build and package (amd64 + arm64)
        env:
          GOOS: windows
          CGO_ENABLED: "0"
        run: |
          for arch in amd64 arm64; do
            GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
              -o Pipatab.exe .
            zip "Pipatab-${{ github.ref_name }}-windows-$arch.zip" Pipatab.exe README.md CHANGELOG.md LICENSE
            rm Pipatab.exe
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Pipatab-*.zip
          generate_release_notes: true
